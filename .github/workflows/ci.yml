name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality-and-simulation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -q
      - run: python -m build
      - name: Verify installed wheel, not source checkout
        run: |
          python -m venv /tmp/event-platform-wheel
          cd /tmp
          /tmp/event-platform-wheel/bin/pip install "$GITHUB_WORKSPACE"/dist/*.whl
          /tmp/event-platform-wheel/bin/event-platform --output "$GITHUB_WORKSPACE"/artifacts/reference-scenario.json
      - uses: actions/upload-artifact@v4
        with:
          name: transactional-event-reference-evidence
          path: artifacts/reference-scenario.json

  aws-template:
    runs-on: ubuntu-latest
    env:
      AWS_DEFAULT_REGION: eu-central-1
      SAM_CLI_TELEMETRY: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/setup-sam@v2
      - run: sam validate --template-file infra/aws/serverless.yaml
